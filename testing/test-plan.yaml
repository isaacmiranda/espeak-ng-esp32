# SPDX-License-Identifier: GPL-3.0-or-later
# Test plan of espeak-ng-esp32 — every test, what it verifies, what it needs, where it lives,
# what it last produced. Owned by /build (docs/Method/standards/testing.md).
#
# status: written by whatever ran the test, never by hand: not done | successful | failed
#         `not done` always carries a reason (not written | not implemented | needs <cap> | precondition).
# Blocked is computed from `needs` against `capabilities`; it is never typed.
# A capability with available: unproven counts as unavailable and is a debugging-agenda item.

fsd: docs/Functionality/FSD.md
phase: 3            # 0 definition · 1 harness · 2 commissioning · 3 build
wave: 1             # 1 standard · 2 deviation · 3 negative + security (locked until the previous is green)

gates:
  load-defined:   {verdict: null, date: null, commit: null}
  ai-harnessed:   {verdict: OPEN, date: 2026-11-26, commit: bc2927a}   # fresh checker; note: tests/bench/ must exist before the first tag
  dut-ready:      {verdict: OPEN, date: 2026-11-26, commit: 5800055}   # fresh checker; board running CI artifact 225e9f8
  ready-for-shipment: {verdict: null, date: null, commit: null}
  shipped:        {verdict: null, date: null, commit: null}

capabilities:
  # --- the bench driver (tools/bench/), one per command; /commission flips each to yes
  bench-discover:
    what: "`bench discover` finds role dut and it matches bench.yaml (serial recorded)"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "dut /dev/ttyACM0 serial=3C:DC:75:F8:63:2C vid_pid=303a:1001 — serial recorded in bench.yaml"}
    proven_by: [tools/bench/tests/test_discover.py]
  bench-chip-info:
    what: "`bench chip-info dut` reports esp32-s3, 16 MB flash, PSRAM and the MAC of the FSD's unit"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "chip=esp32-s3 revision=0.2 flash_mb=16 psram_mb=8 mac=3c:dc:75:f8:63:2c (matches FSD §2.2)"}
    proven_by: [tools/bench/tests/test_chip_info.py]
  bench-flash:
    what: "`bench flash dut <artifact>` writes with offsets from flash_args; the artifact's marker is seen"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "CI run 45859053285 (commit bc2927a) artifact flashed; offsets from flash_args 0x0/0x20000/0x8000/0xf000; ESPK boot fw=bc2927a commit=bc2927a seen; again with CI run 45861574416 (commit 225e9f8): ESPK boot fw=225e9f8 commit=225e9f8, ESPK alive n=1..2"}
    proven_by: [tools/bench/tests/test_flash.py]
  bench-reset:
    what: "`bench reset dut` reboots through the native USB lines; a new ESPK boot is seen"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "wait-event --reset: rst:0x15 (USB_UART_CHIP_RESET) then ESPK boot"}
    proven_by: [tools/bench/tests/test_reset.py]
  bench-telemetry:
    what: "`bench telemetry dut` prints timestamped marker lines"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "ESPK alive n=34..36 one per second, no reset on open (after the RTS-before-DTR fix)"}
    proven_by: [tools/bench/tests/test_telemetry.py]
  bench-command:
    what: "`bench command dut <line>` sends a console line and returns the ESPK reply; refuses volume above the ceiling"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "`xyzzy` -> ESPK error code=unknown_command; `volume 50` refused by the driver (exit 2, ceiling 10)"}
    proven_by: [tools/bench/tests/test_command.py]
  bench-wait-event:
    what: "`bench wait-event dut <pattern> --timeout s [--reset]` opens the listener before acting"
    available: yes
    observed: {date: 2026-11-26, commit: a441368, driver: espk-bench 0.1.0, evidence: "^ESPK boot seen with the listener opened before the reset; ^ESPK alive n=2 seen"}
    proven_by: [tools/bench/tests/test_wait_event.py]
  udev-link:
    what: "/dev/espk-dut exists and points at the board recorded in bench.yaml (`bench udev-rule`)"
    available: yes
    observed: {date: 2026-11-26, evidence: "/dev/espk-dut -> ttyACM0 after `bench udev-rule` installed; bench discover finds serial 3C:DC:75:F8:63:2C"}
    proven_by: [tools/bench/tests/test_udev_and_config.py]
  # --- project equipment and seams
  dut:
    what: "the Waveshare ESP32-S3-RLCD-4.2 named by the FSD §2.2, running this project's artifact"
    available: yes
    observed: {date: 2026-11-27, found: "alertalergo 0.0.1-dev.309+g60b6894 (first session), then always the research firmware", left: "espk_research 2c7946a (local build with ESPK_DATA_DIR, bss=psram, languages pt-br en)", psram: "8MB octal (AP)"}
    note: "shared with alertalergo-v3-firmware: record the firmware found before flashing and the one left after"
    equivalence: "R3 = R1: 100 of 100 says equal over the pt-BR and en verification corpus in sequence (6951a9e); without the wrap every say after the first accented one differs"
    data: "ESPK ready with the ESPK image (pt-br, en; 904 477 B) at 0x620000, init_ms=170"
    limitation: "every open of the port used to reset the board (DTR lowered before RTS); fixed in tools/bench/bench/ports.py — a reset during a test is a bench fault first"
  audio-out:
    what: "ES8311/I2S plays a test tone at bench volume 5 and the firmware reports underrun=0"
    available: yes
    observed: {date: 2026-11-26, commit: cc478df, evidence: "listening session with the responsible present: say of the pt-BR item at listen open 30 not heard; at 70 heard but quiet (the eSpeak PCM carries no gain: volume 5 is inaudible by design); underrun=0, audio_ms=2150, volume back to 5 after listen close. Listener seated in front of the board, which rested on a table (distance not measured); background noise not measured: the board's own microphones (ES7210) could measure it, a capability not built yet (bancada.md risk 2)"}
    proven_by: [tests/bench/test_journey.py::test_jrn_03_say_speaks_through_the_codec]
  pcm-capture:
    what: "the firmware hashes the PCM delivered to the callback (ESPK done … sha256=) — the R3 seam"
    available: yes
    observed: {date: 2026-11-26, commit: cbfa055, evidence: "fresh boot, en, same text 3x: board 4b81fb1cace6/05bf1174dec5/1264807fb7a6 = host R1 sequence; unaccented pt-BR first: 8eea77ff7591 = R1"}
  r1-host-reference:
    what: "upstream 1.52.0 built on the host from the pinned tarball produces PCM hashes and phonemes"
    available: yes
    observed: {date: 2026-11-26, commit: 4d2fd9a, evidence: "TC-REF-01 successful; R1 CLI = Ubuntu espeak-ng CLI bit for bit"}
  espeak-ng-system:
    what: "Ubuntu package espeak-ng 1.52.0+dfsg-5build1 installed on the bench notebook and in CI (R2)"
    available: yes
    observed: {date: 2026-11-26, evidence: "espeak-ng --version: eSpeak NG text-to-speech: 1.52.0 (Ubuntu 1.52.0+dfsg-5build1)"}
  release-verification:
    what: "tag-triggered journey run against the released artifact on the bench notebook runner"
    available: unproven
    note: "becomes yes when /commission has seen one tag run end to end; an absent bench at verify time is not done"

# Journey (FSD §28.1): one workflow test per step, in order. The gate every hardware session runs behind.
tests:
  - id: JRN-01
    title: "Flash the CI artifact; ESPK boot carries the tag's commit"
    shape: workflow
    kind: standard
    tier: target
    wave: 1
    verifies: [FR-RES-01, FR-BLD-04]
    needs: [dut, bench-flash, bench-wait-event, release-verification]
    impl: "tests/bench/test_journey.py::test_jrn_01_boot_carries_the_artifact_commit"
    status: successful
    result: {commit: 6951a9e, date: 2026-11-26, run: "artifact of 6951a9e flashed with bench flash; pytest tests/target tests/bench --run-bench"}
  - id: JRN-02
    title: "ESPK ready: the data image is valid"
    shape: workflow
    kind: standard
    tier: target
    wave: 1
    verifies: [FR-RES-02, FR-DAT-03]
    needs: [dut, bench-wait-event]
    impl: "tests/bench/test_journey.py::test_jrn_02_ready"
    status: successful
    result: {commit: 6951a9e, date: 2026-11-26, run: "artifact of 6951a9e flashed with bench flash; pytest tests/target tests/bench --run-bench"}
  - id: JRN-03
    title: "say a pt-BR verification item: ESPK start, then ESPK done underrun=0"
    shape: workflow
    kind: standard
    tier: target
    wave: 1
    verifies: [FR-RES-03, FR-RES-11, FR-RES-12]
    needs: [dut, bench-command, audio-out]
    impl: "tests/bench/test_journey.py::test_jrn_03_say_speaks_through_the_codec"
    status: successful
    result: {commit: 174a978, date: 2026-11-26, run: "artifact of 174a978 flashed with bench flash; pytest tests/target tests/bench --run-bench; say id=3 samples=47416 audio_ms=2150 underrun=0, volume 5 (inaudible by design)"}
  - id: JRN-04
    title: "The pt-BR item's PCM hash equals R1"

# Mapa de papéis da bancada (docs/Method/project/bancada.md).
# Versionado: papel -> como reconhecer a placa. Caminho de /dev/ttyACM* NUNCA entra aqui.
# `serial` vem do `python -m bench discover` do /commission (2026-11-26).
project: espeak-ng-esp32
link_prefix: /dev/espk-           # regra udev: /dev/espk-<papel>, amarrada ao número de série
status: unproven                  # vira `available` no /commission
shared_with: alertalergo-v3-firmware   # a mesma placa; cada sessão regrava o próprio artefato
audio:
  bench_volume_ceiling: 10        # teto fora de sessão de escuta (FSD FR-RES-07); padrão no boot: 5 (FR-RES-08)
roles:
  dut:
    board: Waveshare ESP32-S3-RLCD-4.2
    chip: esp32s3
    flash_mb: 16
    psram: true
    codec: es8311
    vid_pid: "303a:1001"          # USB-Serial/JTAG nativo; o mesmo par no modo de gravação
    serial: "3C:DC:75:F8:63:2C"      # read by `bench discover` on 2026-11-26
    required: true

# SPDX-License-Identifier: GPL-3.0-or-later
# Every push: lint, licences, host tier, driver tests on the fake port, firmware build (FSD FR-BLD-02).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/espk
          key: espk-r1-${{ hashFiles('components/espeak-ng/tools/upstream.env', 'tools/ref/pcm_dump.c') }}
      - run: ruff check components tools tests conftest.py
      - run: reuse lint
      - run: pytest -q tools/bench tests/host
      - name: data image for the research firmware (pt-br, en)
        run: scripts/build-image.sh espeak.img
      - uses: actions/upload-artifact@v4
        with:
          name: espeak-image
          path: espeak.img
          if-no-files-found: error
  firmware:
    needs: host
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: espeak-image
          path: image
      - name: build research firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export ESPK_IMAGE="$GITHUB_WORKSPACE/image/espeak.img"
          idf.py -C research/firmware -B build build
          scripts/package-artifact.sh build artifact
      - uses: actions/upload-artifact@v4
        with:
          name: espk-research-firmware
          path: artifact/
          if-no-files-found: error

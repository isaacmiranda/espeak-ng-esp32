# SPDX-License-Identifier: GPL-3.0-or-later
# Every push: lint, licences, host tier, driver tests on the fake port, firmware build (FSD FR-BLD-02).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/espk
          key: espk-r1-${{ hashFiles('components/espeak-ng/tools/upstream.env', 'tools/ref/pcm_script.c') }}
      - run: ruff check components tools tests conftest.py
      - run: reuse lint
      - run: python tools/docs/check_translations.py
      - run: pytest -q tools/bench tests/host
      - name: the compiled upstream data, for the examples' builds
        run: cp -r "$(python -c "import sys; sys.path.insert(0, 'tools/ref'); import r1; print(r1.build(r1.upstream()) / 'espeak-ng-data')")" espeak-ng-data
      - uses: actions/upload-artifact@v4
        with:
          name: espeak-data
          path: espeak-ng-data
          if-no-files-found: error
      - name: data image for the research firmware (pt-br, en)
        run: scripts/build-image.sh espeak.img
      - uses: actions/upload-artifact@v4
        with:
          name: espeak-image
          path: espeak.img
          if-no-files-found: error
  firmware:
    needs: host
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: espeak-image
          path: image
      - name: build research firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export ESPK_IMAGE="$GITHUB_WORKSPACE/image/espeak.img"
          idf.py -C research/firmware -B build build
          scripts/package-artifact.sh build artifact
      - uses: actions/upload-artifact@v4
        with:
          name: espk-research-firmware
          path: artifact/
          if-no-files-found: error
  examples:
    needs: host
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32s2, esp32s3, esp32p4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: espeak-data
          path: espeak-ng-data
      - name: build examples/hello for ${{ matrix.chip }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export ESPK_DATA_DIR="$GITHUB_WORKSPACE/espeak-ng-data"
          idf.py -C examples/hello -B build -D IDF_TARGET=${{ matrix.chip }} -D SDKCONFIG=build/sdkconfig build
  r2:
    # FR-REF-07: the system espeak-ng of the Ubuntu release that ships 1.52.0, the exact package version pinned
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      ESPEAK_PKG_VERSION: 1.52.0+dfsg-5build1
    steps:
      - name: packages (espeak-ng at the pinned version, and the build tools of R1)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-venv curl cmake ninja-build gcc g++ \
            espeak-ng=$ESPEAK_PKG_VERSION libespeak-ng1=$ESPEAK_PKG_VERSION espeak-ng-data=$ESPEAK_PKG_VERSION
      - uses: actions/checkout@v4
      - name: R1 against R2 over every voice, API and CLI
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -r requirements.txt
          python tools/ref/r2.py --all --cli --report r2-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: r2-report
          path: r2-report.json
          if-no-files-found: error
  hello-idf6:
    needs: host
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: espeak-data
          path: espeak-ng-data
      - name: build examples/hello with the pinned ESP-IDF 6.x (CON-PLT-03)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export ESPK_DATA_DIR="$GITHUB_WORKSPACE/espeak-ng-data"
          idf.py -C examples/hello -B build -D IDF_TARGET=esp32s3 -D SDKCONFIG=build/sdkconfig build
  example-waveshare:
    needs: host
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: espeak-data
          path: espeak-ng-data
      - name: build examples/waveshare-s3-rlcd
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export ESPK_DATA_DIR="$GITHUB_WORKSPACE/espeak-ng-data"
          idf.py -C examples/waveshare-s3-rlcd -B build -D SDKCONFIG=build/sdkconfig build
